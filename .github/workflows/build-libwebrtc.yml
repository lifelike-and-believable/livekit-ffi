name: Build libwebrtc (no H.264)

# Builds a custom libwebrtc with H.264 disabled, which drops ffmpeg
# (libavcodec/libavutil, LGPL) and OpenH264 (Cisco patent grant) from the
# artifact. See docs/WEBRTC_CODEC_REMOVAL.md for the verified mechanism.
#
# This is a multi-hour, tens-of-GB depot_tools build. It is deliberately
# workflow_dispatch only -- never wire it to push/PR. Build once per libwebrtc
# bump, then consume the published artifact from build-ffi.yml.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "x64"
        type: choice
        options: [x64, arm64]
      profile:
        description: "Build profile"
        required: true
        default: "release"
        type: choice
        options: [release, debug]
      work_dir:
        description: >-
          Persistent build directory OUTSIDE the runner workspace. Keeping the
          ~30-40 GB depot_tools/gclient checkout here lets reruns be incremental
          instead of re-syncing from scratch.
        required: true
        default: "C:\\lk-webrtc"

jobs:
  build:
    name: libwebrtc ${{ inputs.arch }}-${{ inputs.profile }} (no H.264)
    runs-on: [self-hosted, Windows, X64, ue5]
    timeout-minutes: 600

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report disk space
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},
              @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "This build needs roughly 60 GB free on the work_dir volume."

      # Installed directly rather than via actions-rs/toolchain: that action is
      # archived, and on a self-hosted runner without rustup preinstalled it
      # downloads rustup-init to a temp file with no .exe extension and then
      # fails to execute it. Only cargo metadata needs the toolchain here --
      # the libwebrtc build itself is gn/ninja.
      - name: Ensure Rust 1.87.0 (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Test-Path (Join-Path $cargoBin "rustup.exe"))) {
            Write-Host "rustup not present; installing"
            $init = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $init
            & $init -y --default-toolchain none --profile minimal --no-modify-path
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed ($LASTEXITCODE)" }
          }
          $env:PATH = "$cargoBin;$env:PATH"

          rustup toolchain install 1.87.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed ($LASTEXITCODE)" }

          # Persist for later steps instead of relying on a directory override.
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "RUSTUP_TOOLCHAIN=1.87.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & (Join-Path $cargoBin "cargo.exe") --version

      - name: Locate Visual Studio 2022
        id: vs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found - Visual Studio 2022 required" }
          $path = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $path) { throw "No Visual Studio install with the C++ toolset was found" }
          Write-Host "Visual Studio: $path"
          "path=$path" >> $env:GITHUB_OUTPUT

      # The libwebrtc build scripts are vendored inside the webrtc-sys crate, so
      # taking them from the resolved dependency guarantees the WebRTC milestone
      # matches the webrtc-sys this project actually pins. Cloning
      # client-sdk-rust at a branch would not: its main is many versions ahead
      # and targets a different milestone.
      - name: Stage libwebrtc build scripts from the pinned webrtc-sys
        id: stage
        shell: pwsh
        env:
          WORK_DIR: ${{ inputs.work_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = cargo metadata --manifest-path livekit_ffi/Cargo.toml `
            --features with_livekit --format-version 1 | ConvertFrom-Json
          $pkg = @($meta.packages | Where-Object { $_.name -eq 'webrtc-sys' })
          if ($pkg.Count -ne 1) { throw "Expected exactly one webrtc-sys package, found $($pkg.Count)" }
          $version = $pkg[0].version
          $src = Join-Path (Split-Path -Parent $pkg[0].manifest_path) "libwebrtc"
          if (-not (Test-Path $src)) { throw "libwebrtc build scripts not found in webrtc-sys $version" }

          $gclient = Get-Content (Join-Path $src ".gclient") -Raw
          if ($gclient -notmatch "webrtc\.git@(?<ref>[^']+)") { throw "Could not read the WebRTC ref from .gclient" }
          Write-Host "webrtc-sys $version -> WebRTC $($Matches.ref)"

          $dest = Join-Path $env:WORK_DIR "libwebrtc"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Refresh the scripts/patches only. Any existing depot_tools/ and src/
          # checkouts live alongside them and are deliberately left in place so
          # reruns stay incremental.
          Copy-Item -Path (Join-Path $src "*") -Destination $dest -Recurse -Force
          "dir=$dest" >> $env:GITHUB_OUTPUT
          "webrtc_ref=$($Matches.ref)" >> $env:GITHUB_OUTPUT

      - name: Disable H.264 in the gn args
        shell: pwsh
        env:
          BUILD_DIR: ${{ steps.stage.outputs.dir }}
          VS_PATH: ${{ steps.vs.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Join-Path $env:BUILD_DIR "build_windows.cmd"
          $text = Get-Content $cmd -Raw

          # Upstream hardcodes rtc_use_h264=true and ffmpeg_branding="Chrome".
          # Flipping rtc_use_h264 to false drops //third_party/ffmpeg and
          # //third_party/openh264:encoder from the webrtc_h264 target's deps,
          # and stops the root BUILD.gn defining WEBRTC_USE_H264.
          if ($text -notmatch 'rtc_use_h264=true') {
            throw "Expected 'rtc_use_h264=true' in build_windows.cmd - upstream script changed, review before proceeding."
          }
          $text = $text -replace 'rtc_use_h264=true', 'rtc_use_h264=false'

          # ffmpeg_branding is declared by //third_party/ffmpeg. With ffmpeg out
          # of the build graph gn would reject it as an unknown build argument,
          # so remove it rather than retarget it to "Chromium".
          $text = $text -replace '\s*ffmpeg_branding=\\"Chrome\\"', ''
          if ($text -match 'ffmpeg_branding') {
            throw "ffmpeg_branding still present after rewrite - review the substitution."
          }

          # Upstream pins Enterprise; use whatever edition this runner has.
          $text = $text -replace '(?m)^set vs2019_install=.*$', "set vs2019_install=$($env:VS_PATH)"

          # Two problems with the upstream ninja line.
          #
          # 1. It invokes `ninja.exe`, but depot_tools no longer bundles that
          #    binary -- ninja is CIPD-managed and reached through ninja.bat.
          #    Dropping the extension lets cmd resolve whichever launcher this
          #    depot_tools revision actually ships, via PATHEXT. `call` is
          #    required so control returns here when it resolves to a .bat;
          #    without it the rest of the script would never run.
          # 2. Its exit code is ignored. The copy/xcopy commands that follow
          #    reset errorlevel, so a failed (or missing) compile still exits 0
          #    and the absent webrtc.lib only surfaces much later.
          if ($text -notmatch '(?m)^ninja\.exe -C %OUTPUT_DIR% :default\s*$') {
            throw "Could not find the ninja invocation in build_windows.cmd - upstream script changed."
          }
          # The script uses LF endings; keep them rather than splicing in CRLF.
          $text = $text -replace '(?m)^ninja\.exe (-C %OUTPUT_DIR% :default)\s*$',
                                 "call ninja `$1`nif errorlevel 1 exit /b 1"

          # /F echoes every copied path, burying the build output under tens of
          # thousands of lines; /Q keeps the log readable. /Y is required for
          # reruns: xcopy prompts before overwriting, and unlike `copy` it gets
          # no automatic yes inside a batch file, so with no stdin in CI the
          # second run into a populated artifact dir hangs then fails.
          $text = $text -replace '(xcopy src\\\*\.\w+ "%ARTIFACTS_DIR%\\include") /C /S /I /F /H', '$1 /C /S /I /H /Q /Y'

          Set-Content -Path $cmd -Value $text -NoNewline
          Write-Host "--- effective gn args ---"
          Select-String -Path $cmd -Pattern 'is_debug=' | ForEach-Object { $_.Line.Trim() }
          Write-Host "--- ninja invocation ---"
          Select-String -Path $cmd -Pattern 'call ninja' | ForEach-Object { $_.Line.Trim() }

          # Which ninja launcher this depot_tools revision ships. Informational:
          # on a clean machine build_windows.cmd clones depot_tools itself, so
          # this is empty on the first run.
          $dt = Join-Path $env:BUILD_DIR "depot_tools"
          if (Test-Path $dt) {
            Write-Host "--- ninja launchers in depot_tools ---"
            Get-ChildItem $dt -Filter "*ninja*" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.Name)" }
          }

      - name: Build libwebrtc
        shell: cmd
        working-directory: ${{ steps.stage.outputs.dir }}
        run: |
          call build_windows.cmd --arch ${{ inputs.arch }} --profile ${{ inputs.profile }}
          if errorlevel 1 exit /b 1

      # Belt and braces: even with the ninja guard patched in, confirm the
      # artifact actually materialised before spending time scanning it, and
      # dump where the .lib files really landed if it did not.
      - name: Assert webrtc.lib was produced
        shell: pwsh
        env:
          BUILD_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $art = Join-Path $env:BUILD_DIR "win-${{ inputs.arch }}-${{ inputs.profile }}"
          $lib = Join-Path $art "lib\webrtc.lib"
          if (Test-Path $lib) {
            Write-Host ("OK: webrtc.lib present ({0:N0} bytes)" -f (Get-Item $lib).Length)
            exit 0
          }

          Write-Host "webrtc.lib missing from $art -- diagnostics:"
          Write-Host "--- artifact dir ---"
          Get-ChildItem $art -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

          $out = Join-Path $env:BUILD_DIR "src\out-${{ inputs.arch }}-${{ inputs.profile }}"
          Write-Host "--- largest .lib under $out ---"
          Get-ChildItem $out -Filter *.lib -Recurse -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 15 FullName, Length |
            Format-Table -AutoSize | Out-String | Write-Host

          throw "ninja did not produce webrtc.lib - see diagnostics above."

      - name: Verify H.264 is absent
        shell: pwsh
        env:
          BUILD_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $art = Join-Path $env:BUILD_DIR "win-${{ inputs.arch }}-${{ inputs.profile }}"
          if (-not (Test-Path $art)) { throw "Artifact dir not produced: $art" }

          # webrtc-sys scrapes -D flags from the first line of webrtc.ninja and
          # applies them to its own shim. No -DWEBRTC_USE_H264 here means its
          # encoder-side guard correctly compiles the OpenH264 adapter out.
          $ninja = Join-Path $art "webrtc.ninja"
          if (-not (Test-Path $ninja)) { throw "webrtc.ninja missing from artifact" }
          if ((Get-Content $ninja -TotalCount 1) -match 'WEBRTC_USE_H264') {
            throw "webrtc.ninja still defines WEBRTC_USE_H264 - H.264 was not disabled."
          }
          Write-Host "OK: webrtc.ninja does not define WEBRTC_USE_H264"

          & "$env:GITHUB_WORKSPACE\tools\check-no-video-codecs.ps1" -Binary (Join-Path $art "lib\webrtc.lib")

      - name: Package artifact
        shell: pwsh
        env:
          BUILD_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $art = Join-Path $env:BUILD_DIR "win-${{ inputs.arch }}-${{ inputs.profile }}"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          $zip = "$env:GITHUB_WORKSPACE\artifacts\libwebrtc-win-${{ inputs.arch }}-${{ inputs.profile }}-noh264.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$art\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host ("Packaged {0:N0} bytes" -f (Get-Item $zip).Length)

      - name: Upload libwebrtc artifact
        uses: actions/upload-artifact@v7
        with:
          name: libwebrtc-win-${{ inputs.arch }}-${{ inputs.profile }}-noh264
          path: artifacts/libwebrtc-win-${{ inputs.arch }}-${{ inputs.profile }}-noh264.zip
          retention-days: 90
