name: Build LiveKit FFI SDK

on:
  push:
    paths:
      - 'livekit_ffi/**'
      - 'tools/**'
      - '.github/workflows/build-ffi.yml'
  pull_request:
    paths:
      - 'livekit_ffi/**'
      - 'tools/**'
      - '.github/workflows/build-ffi.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  windows-msvc:
    name: Windows (MSVC) Release
    # libwebrtc-* releases carry a libwebrtc toolchain artifact, not an SDK
    # release. Without this guard, publishing one would build the SDK and
    # attach livekit_ffi zips to it.
    if: ${{ github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'libwebrtc-') }}
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # actions-rs/* is archived and targets an EOL Node runtime. This action is
      # composite (shell only), so it has no Node runtime to deprecate; the
      # toolchain version comes from the ref.
      - name: Install Rust 1.87.0 (MSVC)
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            livekit_ffi

      # Consume the H.264-free libwebrtc built by build-libwebrtc.yml. Its URL
      # and digest are pinned in libwebrtc.lock.json rather than a repository
      # variable, so the DLL is reproducible from the repo alone and the
      # provenance is reviewable in the diff. With no lockfile (or no url in
      # it) the build falls back to the prebuilt libwebrtc that webrtc-sys
      # downloads by default, which still contains H.264.
      - name: Restore custom libwebrtc (no H.264)
        id: webrtc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lockPath = Join-Path $env:GITHUB_WORKSPACE "libwebrtc.lock.json"
          if (-not (Test-Path $lockPath)) {
            Write-Host "No libwebrtc.lock.json - using the webrtc-sys prebuilt (H.264 present)."
            exit 0
          }
          $lock = Get-Content $lockPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($lock.url)) {
            Write-Host "libwebrtc.lock.json has no url - using the webrtc-sys prebuilt (H.264 present)."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($lock.sha256)) {
            throw "libwebrtc.lock.json has a url but no sha256; refusing to use an unverified build."
          }

          $dest = Join-Path $env:RUNNER_TEMP "libwebrtc"
          $zip  = Join-Path $env:RUNNER_TEMP "libwebrtc.zip"
          Write-Host "Fetching $($lock.url)"
          Invoke-WebRequest -Uri $lock.url -OutFile $zip

          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $lock.sha256.ToLower()) {
            throw "libwebrtc digest mismatch.`n  expected $($lock.sha256)`n  got      $sha"
          }
          Write-Host "sha256 verified: $sha"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          # webrtc-sys requires include/, lib/webrtc.lib and webrtc.ninja at the
          # root of LK_CUSTOM_WEBRTC.
          foreach ($p in @("include", "lib\webrtc.lib", "webrtc.ninja")) {
            if (-not (Test-Path (Join-Path $dest $p))) { throw "Custom libwebrtc missing: $p" }
          }
          "LK_CUSTOM_WEBRTC=$dest" >> $env:GITHUB_ENV
          Write-Host "Using custom libwebrtc at $dest"

      - name: Build (Release, with_livekit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd livekit_ffi
          cargo build --release --features with_livekit

      # Guards against ffmpeg (LGPL) and OpenH264 re-entering the shipped DLL.
      # Report-only until the H.264-free libwebrtc lands -- the current prebuilt
      # libwebrtc is built with rtc_use_h264=true, so this reports hits today by
      # design. Flip to a hard failure once a clean build is in use.
      - name: Scan for video codecs (ffmpeg / OpenH264)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File "tools/check-no-video-codecs.ps1" `
            -Binary "livekit_ffi/target/release/livekit_ffi.dll" -ReportOnly

      - name: Package SDK (headers + libs + dll + pdb)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File "tools/package.ps1" -CrateDir "livekit_ffi" -OutDir "artifacts/windows-x64"

      - name: Upload artifact (SDK)
        uses: actions/upload-artifact@v7
        with:
          name: livekit-ffi-sdk-windows-x64
          path: |
            artifacts/windows-x64/**

      - name: Package Plugin Layout (ThirdParty + Binaries)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File "tools/package-plugin.ps1" -CrateDir "livekit_ffi" -OutDir "artifacts/plugin-windows-x64" -ThirdPartyName "livekit_ffi"

      - name: Upload artifact (PluginLayout)
        uses: actions/upload-artifact@v7
        with:
          name: livekit-ffi-plugin-windows-x64
          path: |
            artifacts/plugin-windows-x64/**

  release-assets:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && !startsWith(github.event.release.tag_name, 'libwebrtc-') }}
    needs: [windows-msvc]
    runs-on: ubuntu-latest
    steps:
      - name: Download SDK artifact
        uses: actions/download-artifact@v8
        with:
          name: livekit-ffi-sdk-windows-x64
          path: artifacts/windows-x64

      - name: Download Plugin artifact
        uses: actions/download-artifact@v8
        with:
          name: livekit-ffi-plugin-windows-x64
          path: artifacts/plugin-windows-x64

      - name: Create zip
        run: |
          cd artifacts/windows-x64
          zip -r ../livekit-ffi-sdk-windows-x64.zip .
          cd ../plugin-windows-x64
          zip -r ../livekit-ffi-plugin-windows-x64.zip .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/livekit-ffi-sdk-windows-x64.zip
            artifacts/livekit-ffi-plugin-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
